body{margin:0}
*{box-sizing:border-box}

.door{width:26px;height:38px;background:#2A1640;border-radius:13px 13px 0 0}
.lab{margin-top:6px;background:rgba(255,248,240,.95);border-radius:10px;padding:2px 10px;font:800 15px 'Baloo 2',sans-serif;color:#2A1640}
.pin{position:absolute;width:58px;height:58px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px #fff, 0 6px 0 4px rgba(42,22,64,.2)}
.tail{position:absolute;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
.tree{position:absolute;width:56px;height:56px;border-radius:50%;background:#4E9A2E;box-shadow:inset -6px -6px 0 rgba(42,22,64,.15)}
</style>
