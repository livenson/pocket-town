<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene view, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;background:none}
.t{background:#fff;border-radius:18px;box-shadow:0 5px 0 rgba(42,22,64,.22);display:flex;align-items:center;justify-content:center;color:#2A1640;width:60px;height:60px;flex:none}
.tip{position:absolute;background:#2A1640;color:#fff;border-radius:12px;padding:7px 12px;font:800 15px Nunito,sans-serif;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tip kbd{background:#fff;color:#2A1640;border-radius:6px;padding:0 7px;font:900 13px Nunito,sans-serif}
.row{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:18px;padding:4px 12px 4px 4px;font:800 17px 'Baloo 2',sans-serif;color:#2A1640}
.av{position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none}
.it{height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#2A1640;box-shadow:0 4px 0 rgba(42,22,64,.12)}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;background:#F3C99B;color:#2A1640;font-family:Nunito,system-ui,sans-serif;overflow:hidden">
  <div style="position:absolute;left:0;top:0;width:1440px;height:896px"><div style="transform:scale(1.6);transform-origin:0 0"><dc-import name="Room" sel="{{true}}" hint-size="900px,560px"></dc-import></div></div>

  <div style="position:absolute;left:740px;top:500px;width:150px;height:230px;border-radius:40px;border:4px solid #fff;box-shadow:0 0 0 4px #2A1640"></div>
  <div class="tip" style="left:700px;top:448px">Pim · dancing <kbd>Enter</kbd> card</div>

  <div style="position:absolute;left:28px;top:24px;display:flex;gap:10px">
    <button class="t" aria-label="Home (H)"><dc-import name="Icon" icon="home" size="30" hint-size="30px,30px"></dc-import></button>
    <button class="t" aria-label="Undo (Ctrl Z)"><dc-import name="Icon" icon="undo" size="30" hint-size="30px,30px"></dc-import></button>
    <button class="t" aria-label="Redo (Ctrl Shift Z)"><dc-import name="Icon" icon="redo" size="30" hint-size="30px,30px"></dc-import></button>
  </div>
  <div style="position:absolute;right:28px;top:24px;display:flex;gap:10px">
    <button class="t" aria-label="Map (M)"><dc-import name="Icon" icon="map" size="30" hint-size="30px,30px"></dc-import></button>
    <button class="t" style="box-shadow:0 0 0 4px #4F6BF0, 0 5px 0 rgba(42,22,64,.22);transform:translateY(-3px)" aria-label="Edit room (E)"><dc-import name="Icon" icon="pencil" size="30" hint-size="30px,30px"></dc-import></button>
  </div>
  <div class="tip" style="right:24px;top:100px"><dc-import name="Icon" icon="speaker" size="18" hint-size="18px,18px"></dc-import>Edit this room <kbd>E</kbd></div>

  <nav style="position:absolute;left:24px;top:116px;width:200px;padding:12px;border-radius:28px;background:#FFF8F0;box-shadow:0 6px 0 rgba(42,22,64,.2);display:flex;flex-direction:column;gap:4px" aria-label="Characters here">
    <button class="row"><span class="av" style="background:#FFD2AE"><span style="position:absolute;left:0;top:-4px"><dc-import name="Peg" size="76" hair-style="bob" outfit="#EF4B2F" skin="#E9B48A" label="" hint-size="47px,76px"></dc-import></span></span>Moku</button>
    <button class="row" style="background:#FFE6CF;box-shadow:inset 0 0 0 3px #2A1640"><span class="av" style="background:#FFE08A"><span style="position:absolute;left:0;top:4px"><dc-import name="Peg" size="76" hair-style="puff" outfit="#FFB627" skin="#8D5A3B" label="" hint-size="47px,76px"></dc-import></span></span>Pim</button>
    <button class="row"><span class="av" style="background:#CDD6FF"><span style="position:absolute;left:0;top:0"><dc-import name="Peg" size="76" hair-style="bun" outfit="#4F6BF0" skin="#C98E62" hair="#5A2E1A" aid="hearing" label="" hint-size="47px,76px"></dc-import></span></span>Lumo</button>
    <button class="row"><span class="av" style="background:#FAD0DC"><span style="position:absolute;left:0;top:-4px"><dc-import name="Peg" size="76" hair-style="bob" outfit="#FF8FB1" skin="#5A3725" hair="#FFB627" aid="arm" label="" hint-size="47px,76px"></dc-import></span></span>Nella</button>
    <button class="row"><span class="av" style="background:#D9F0C4"><span style="position:absolute;left:0;top:-4px"><dc-import name="Peg" size="76" hair-style="none" outfit="#7BC74D" skin="#F6D2B4" label="" hint-size="47px,76px"></dc-import></span></span>Oki</button>
    <div style="margin-top:6px;font-size:13px;font-weight:800;color:#6B4A6E;padding-left:6px"><kbd style="background:#fff;border-radius:6px;padding:0 6px;box-shadow:0 2px 0 #D9C3B0">Tab</kbd> next character</div>
  </nav>

  <section style="position:absolute;left:250px;right:280px;bottom:20px;height:116px;border-radius:30px;background:#FFF8F0;box-shadow:0 6px 0 rgba(42,22,64,.22);padding:16px;display:flex;gap:12px;align-items:center" aria-label="Things drawer">
    <div style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:12px;flex:1">
      <button class="it" style="background:#FFD2AE" aria-label="Cake"><dc-import name="Icon" icon="cake" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#FFE08A" aria-label="Star cookie"><dc-import name="Icon" icon="star" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#BFE6DC" aria-label="Ball"><dc-import name="Icon" icon="ball" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#E6CCF0" aria-label="Music box"><dc-import name="Icon" icon="note" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#CDD6FF" aria-label="Book"><dc-import name="Icon" icon="book" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#D9F0C4" aria-label="Plant"><dc-import name="Icon" icon="plant" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#FAD0DC" aria-label="Gift heart"><dc-import name="Icon" icon="heart" size="40" hint-size="40px,40px"></dc-import></button>
      <button class="it" style="background:#FFE6CF" aria-label="Next page"><dc-import name="Icon" icon="next" size="36" hint-size="36px,36px"></dc-import></button>
    </div>
  </section>

  <div style="position:absolute;right:24px;bottom:24px;display:flex;align-items:center;gap:10px">
    <button class="t" aria-label="Camera (C)"><dc-import name="Icon" icon="camera" size="30" hint-size="30px,30px"></dc-import></button>
    <div style="display:flex;background:#fff;border-radius:999px;padding:5px;gap:3px;box-shadow:0 5px 0 rgba(42,22,64,.22)" role="group" aria-label="Time">
      <button style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center" aria-label="Pause (Space)"><dc-import name="Icon" icon="pause" size="26" hint-size="26px,26px"></dc-import></button>
      <button style="width:52px;height:52px;border-radius:50%;background:#2A1640;color:#fff;display:flex;align-items:center;justify-content:center" aria-label="Play, on" aria-pressed="true"><dc-import name="Icon" icon="play" size="26" hint-size="26px,26px"></dc-import></button>
      <button style="width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center" aria-label="Faster (F)"><dc-import name="Icon" icon="ff" size="26" hint-size="26px,26px"></dc-import></button>
    </div>
  </div>
  <div style="position:absolute;left:24px;bottom:28px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;background:rgba(255,248,240,.9);border-radius:999px;padding:8px 14px"><kbd style="background:#fff;border-radius:6px;padding:0 7px;box-shadow:0 2px 0 #D9C3B0;font-weight:900">?</kbd>shortcuts</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
